# t44 "Voldemort" — InternVL3-78B QLoRA 4-bit, 4 pass, fold0/2 — การ์ดใบเดียว
# รัน (จากโฟลเดอร์นี้):  llamafactory-cli train train_t44_internvl3_fold0.yaml
#
# ⛔ ห้ามรันไฟล์นี้เต็มก่อนผ่าน "ประตู go/no-go ~$2" (internvl_arm_dossier.md §4 ทาง ก):
#    โหลด base 4-bit + tiling เต็ม โดยไม่มี adapter แล้วให้อ่านแบบจริง 3-5 หน้า
#    - base อ่าน mark ออก (เช่นตอบ B2/C1/F1 ได้ตรง) = ตา InternViT รอด 4-bit → เดินต่อ
#    - base เพ้อ/ตอบเป็นบ้านคนละหลัง = หยุด เสียแค่ ~$2 ไม่ใช่ทั้งคืน (บทเรียน t04)
#    เหตุผล: เอกสารทางการ InternVL เตือนตรง ๆ ว่า BNB 4-bit บน InternViT-6B "produce
#    nonsensical outputs and fail to understand images" และ LLaMA-Factory quantize
#    ทั้งก้อนไม่เว้น ViT (verify จาก quantization.py 2026-08-31: ไม่มี modules_to_not_convert)
#
# ⚠️ ข้อเท็จจริงที่ต้องรู้ก่อนเทียบผลกับแขน Courser (Qwen3.6):
#    tiling เต็ม 12+1 tile = ภาพถูกย่อลงเหลือราว 12×448² ≈ 2.4 ล้านพิกเซล ก่อนอ่าน
#    ขณะที่ Qwen ฝั่ง Courser อ่านได้ถึง 7.86 ล้านพิกเซล — **InternVL เห็นรายละเอียด
#    น้อยกว่าราว 3.3 เท่าโดยสถาปัตยกรรม** ไม่ใช่เพราะตั้งค่าผิด งานเราคือตัวหนังสือ/มาร์คเล็ก
#    (งานวิจัย 2026-08-31: ความละเอียดยิ่งสูงยิ่งดีสำหรับข้อความเล็ก ยังไม่อิ่มตัวที่ 6MP)
#    → ถ้า Voldemort แพ้ Courser อย่าเพิ่งสรุปว่าโมเดลแย่กว่า อาจเป็นเพดานความละเอียดล้วน ๆ

### model
model_name_or_path: OpenGVLab/InternVL3-78B-hf  # ต้องเป็นตัว -hf (transformers-native) เท่านั้น
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true

# ★★★ บรรทัดที่ฆ่า t04 ทั้งรอบ — ไม่มีบรรทัดนี้ = ทุกภาพเหลือ tile เดียว 256 token อ่านไม่ออก ★★★
# verify จาก source จริงบน main 2026-08-31: mm_plugin.py:1191 เปิด tiling เฉพาะเมื่อ
# getattr(processor,"crop_to_patches",False) เป็นจริง และ preprocessor_config.json ของโมเดล
# ตั้ง false มาจากโรงงาน (ส่วนตอน infer transformers hardcode True → train/infer mismatch)
# รองรับเป็น ProcessorArguments ตั้งแต่ v0.9.3 (PR #7817) — ต้องใช้ LLaMA-Factory ≥ 0.9.3
crop_to_patches: true

# max_patches=12 / min_patches=1 hardcode ใน plugin ปรับผ่าน yaml ไม่ได้ — คุมทางอ้อมด้วยค่านี้
# 4194304 = 2048² : สูงพอให้ algorithm เลือก 12 tile เต็มเสมอสำหรับหน้าแบบเรา (7.7 MP)
# → 13 tile (12 + thumbnail) × 256 token = 3,328 token/ภาพ
image_max_pixels: 4194304
video_max_pixels: 16384

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16       # ยกจาก t03 (จูนมาเพื่อ MoE) — dense+QLoRA headroom ต่างกัน ควรลองขยับหลังเห็น VRAM จริง
lora_alpha: 32
lora_dropout: 0.0   # parity กับแขน Courser (Unsloth ตั้ง 0 ชัด) — LF default ก็ 0.0 แต่เขียนชัดตาม Lesson 12: ค่าที่ไม่เขียนคือตัวแปรที่หายจาก parity table
lora_target: all    # [W] LoRA Without Regret — แปะทุก layer ไม่ใช่แค่ attention

### dataset — 4 pass (pass0 + pass1 + pass2.4 + pass3) เนื้อเดียวกับแขน Courser เป๊ะ
# k-fold 2 (มะขามสั่ง 2026-08-31 ค่ำ): k=5 จริง (8 บ้าน/fold จาก 40 บ้าน) รันแค่ fold0+fold1
# = train/val 4:1 ต่อ fold — ไฟล์นี้คือ **fold0** เท่านั้น fold1 อยู่ train_t44_internvl3_fold1.yaml
dataset: t44_train_fold0     # ลงทะเบียนใน dataset_info.json โดย ../t05_Courser/build_4pass.py
eval_dataset: t44_val_fold0
template: intern_vl          # ยืนยันจาก constants.py: InternVL3-*-hf ทั้งตระกูล → intern_vl
dataset_dir: .               # dataset_info.json + train_lf.json/val_lf.json อยู่โฟลเดอร์นี้
# path รูปใน train_lf.json เทียบ "รากรีโป Training" (image/<บ้าน>/… และ tune_ai/…/marked_t5/…)
# ซึ่งอยู่คนละที่กับ dataset_dir → ต้องตั้ง media_dir แยก (verify: data_args.py:42-45 มีจริง,
# converter.py:58 เป็นที่ join path — ⚠️ ไฟล์หายจะแค่ warn ไม่ error ให้รัน smoke_4pass.py ก่อนเสมอ)
media_dir: ../..
cutoff_len: 32768   # วัดแล้ว: visual สูงสุด 13,312 (4 ภาพ × 3,328) + text สูงสุด ~16,400 ≈ 29,700
                    # เหลือ margin ~10% — ห้ามลดโดยไม่วัดใหม่ (label จะโดนตัดกลาง JSON, บั๊กคลาส t01)
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: outputs_t44_fold0/lora
logging_steps: 5
save_steps: 25
save_strategy: steps
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
# [2026-08-31] มะขามสั่งเช่า 4 การ์ดพร้อมกัน: fold0+fold1 × Courser+Voldemort คู่ขนาน
# หลังเทรนครบ รวม fold0+fold1 เป็น adapter เดียวด้วย PEFT model soup
# (../merge_adapters_soup.py, add_weighted_adapter linear 0.5/0.5) — ไม่ deploy แยก 2 adapter
push_to_hub: true
hub_model_id: dacarokann/Voldemort_a   # a=fold0, b=fold1 (fold1.yaml)
hub_strategy: checkpoint
# export HF_TOKEN=hf_...XCRE (token ชื่อ "t44", FINEGRAINED) ก่อนรัน — llamafactory-cli
# อ่าน env HF_TOKEN เอง ไม่ต้อง huggingface-cli login แยก

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
optim: adamw_8bit        # parity กับ Courser — ไม่เขียน = HF default adamw_torch (คนละ optimizer เงียบๆ, ช่องว่าง Lesson 12 ที่ t04 ก็มี); ใช้ตัวธรรมดาไม่ใช่ paged (paged เคย crash จริง 2026-08-24)
weight_decay: 0.01       # parity กับ Courser (0.01) — ไม่เขียน = HF default 0.0 คนละค่ากับอีกแขนเงียบๆ
num_train_epochs: 2.0    # [2026-08-31 ค่ำ] 3→2 (parity กับ Courser) — research LoRA/QLoRA: 2 vs 3
                         # epoch ผล accuracy ต่างมักแค่ 1-3% แต่ 3 epoch กิน GPU-ชม.+50% และ risk
                         # overfit สูงขึ้น (ท่องจำแทนอ่านแบบ) — ไม่ใช่ค่าที่วัด converge จริงของรอบนี้
                         # ดู loss curve ว่ายังลดต่อเนื่องไหมช่วงท้าย epoch 2 ก่อนพิจารณาขยับ
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
seed: 3407
ddp_timeout: 180000000

### eval
# eval_strategy: steps
# eval_steps: 500
# per_device_eval_batch_size: 1
# ปิดไว้ก่อนตามบทเรียน t03 (eval OOM จาก fp32 logit upcast) — แต่ 2026-08-31 พบว่ามีทางเลี่ยง
# ที่ยังไม่ได้ลอง: fp16_full_eval + eval_accumulation_steps (เอกสาร Unsloth; ฝั่ง LLaMA-Factory
# ต้องเช็คแยก) ถ้าอยากได้ eval_loss curve จริงรอบนี้ ให้ทดสอบเปิดตอน dry-run ก่อน ไม่ใช่ตอนรันเต็ม

