# t04 — InternVL3-78B QLoRA 4-bit, การ์ดใบเดียว (มะขามเคาะ 2026-08-30, ดู t04_workflow.md Phase 0)
# รันด้วย LLaMA-Factory: llamafactory-cli train train_t04_internvl3_qlora.yaml
# เขียนตาม official example จริง (ยืนยันจาก repo hiyouga/LLaMA-Factory 2026-08-30, ไม่ได้เดา):
#   examples/train_qlora/qwen3_lora_sft_otfq.yaml (โครง QLoRA/bnb)
#   examples/train_lora/qwen3vl_lora_sft.yaml (โครง vision-LoRA)
# ⚠️ ค่าที่ยังไม่ verify กับ dataset จริง — ต้อง dry-run บนการ์ดถูกก่อนเชื่อ (ดู workflow ข้อ 6):
#   cutoff_len, image_max_pixels, lora_rank — ทั้งสามตัวนี้ยกมาจาก Qwen ไม่ได้เด็ดขาด
#   (คนละ tokenizer/คนละกลไก resize) นี่คือค่าเริ่มต้นระวังไว้ก่อน ไม่ใช่ค่าสุดท้าย

### model
model_name_or_path: OpenGVLab/InternVL3-78B-hf  # ⚠️ ต้องเป็นตัว -hf (transformers-native) เท่านั้น
                                                  # LLaMA-Factory ลงทะเบียนไว้แบบนี้ (constants.py) —
                                                  # repo เปล่า OpenGVLab/InternVL3-78B ใช้ไม่ได้ตรงๆ
quantization_bit: 4       # choices: [8 (bnb/hqq/eetq), 4 (bnb/hqq), 3 (hqq), 2 (hqq)]
quantization_method: bnb  # bitsandbytes NF4 — dense model รองรับจริง (ต่างจาก Qwen3.6/3.5 ที่เป็น MoE
                           # แล้ว bitsandbytes 4-bit ใช้ไม่ได้ — เช็คแล้วทั้งคู่ ดู t04_workflow.md)
trust_remote_code: true
image_max_pixels: 1048576  # ⚠️ ค่าเริ่มต้นระวังไว้ก่อน (พอๆ กับ MAX_PIXELS เดิมของ Qwen3.6 ที่ 5120*1024
                            # หารด้วย token/pixel ratio คนละแบบ) InternVL3 ใช้ dynamic tiling 448px/tile
                            # ไม่ใช่ longest_edge — ต้องวัด token จริงต่อภาพก่อนเชื่อเลขนี้
video_max_pixels: 16384    # ไม่ใช้วิดีโอในสายพานนี้ ปล่อยตาม default

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16       # ⚠️ ค่าเริ่มต้น (เท่า r ของ t03 หลัง OOM-tune) — dense+QLoRA มี headroom ต่างจาก
                    # MoE เดิมมาก ควรลองขยับขึ้นได้หลัง dry-run เห็น VRAM จริง
lora_alpha: 32      # = 2×r ตามธรรมเนียมเดิม (t01/t03)
lora_target: all    # [W] LoRA Without Regret: แปะทุก layer ไม่ใช่แค่ attention — บทเรียนเดิมยังใช้ได้
                    # ข้ามสถาปัตยกรรม

### dataset
dataset: t04_train           # ลงทะเบียนใน dataset_info.json โดย build_dataset_llamafactory.py แล้ว
eval_dataset: t04_val
template: intern_vl          # ยืนยันจาก LLaMA-Factory constants.py: InternVL3-*-hf ทั้งตระกูล → intern_vl
dataset_dir: .                # รันจาก data_before_tune/ เอง (train_lf.json/val_lf.json/images/ อยู่ที่นี่)
cutoff_len: 32768   # ⚠️ ค่าเริ่มต้นระวังไว้ก่อน (ต่ำกว่า MAX_LENGTH เดิมของ Qwen 47104 โดยตั้งใจ —
                    # ยังไม่วัด token จริงของ tokenizer InternVL3 กับ dataset นี้ ถ้า OOM/ตัด label
                    # กลาง JSON ต้องวัดใหม่ ห้ามลดเฉยๆ โดยไม่เช็คว่า label ขาดหรือเปล่า — บทเรียน t01 §0.4)
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: outputs_t04/lora   # ตรงกับ convention เดิมของ t04 (train_t03.py/infer_house_t03.py แก้ไว้แล้ว)
logging_steps: 5
save_steps: 25        # เท่า t03 (บทเรียน: save_strategy epoch เสี่ยงไม่มี checkpoint ถ้าพังกลางทาง)
save_strategy: steps
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4    # [t01/t03] พิสูจน์ converge แล้วข้ามรอบ — ค่านี้ไม่ผูกสถาปัตยกรรม ยกมาได้
num_train_epochs: 5.0   # มะขามเคาะ 2026-08-30: เปลี่ยนจาก 3.0 → 5.0 (ให้ตรงจำนวนรอบกับแนวคิด k-fold=5
                         # จาก 40 หลัง ÷ 8 หลัง/fold ที่คุยกันไว้ตอนต้น — เป็นการตัดสินใจของมะขาม ไม่ใช่
                         # ค่าที่วัด converge จริง ต้องดู loss curve จริงว่า overfit ไหมหลัง epoch 3-4)
lr_scheduler_type: cosine
warmup_ratio: 0.05        # = ค่า t03 (ไม่ใช่ default 0.1 ของตัวอย่าง LLaMA-Factory — ตั้งใจตาม parity)
bf16: true                 # compute dtype บน 4-bit weights (ตามตัวอย่าง otfq.yaml จริง)
seed: 3407                 # [W] docs, เท่า t01/t03
ddp_timeout: 180000000

### eval
# eval_strategy: steps
# eval_steps: 500
# per_device_eval_batch_size: 1
# ⚠️ ปิดไว้ก่อนโดยตั้งใจ (comment ออก) — t03 เจอ eval ต่อ epoch OOM จริงจาก accelerate
# convert_to_fp32 upcast logits ทั้งก้อน (35B+ความละเอียดเต็ม) แม้เทรนไม่ OOM ก็ตาม
# ยังไม่รู้ว่า LLaMA-Factory trainer มีปัญหาเดียวกันไหม (Unsloth ใช้ fused loss ไม่ materialize
# logits เต็ม — LLaMA-Factory อาจไม่มี fused loss แบบเดียวกัน) ทดสอบ eval แยกก่อนเปิดใช้เต็ม
