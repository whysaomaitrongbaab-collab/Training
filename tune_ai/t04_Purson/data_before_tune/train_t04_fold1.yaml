# t04 Purson — fold1 ของ k-fold 2-folds (มะขามเคาะ 2026-08-30 คืนนี้: เช่า 2 การ์ดคู่ขนาน)
# รันบนการ์ดใบใหม่ (เช่าเพิ่มคืนนี้) — เหมือน train_t04_internvl3_qlora.yaml ทุกอย่าง
# ต่างแค่ dataset (fold1) + output_dir
### model
model_name_or_path: OpenGVLab/InternVL3-78B-hf
quantization_bit: 4
quantization_method: bnb
trust_remote_code: true
image_max_pixels: 1048576
video_max_pixels: 16384

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

### dataset
dataset: t04_fold1_train
eval_dataset: t04_fold1_val
template: intern_vl
dataset_dir: .
cutoff_len: 32768
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: outputs_t04/fold1
logging_steps: 5
save_steps: 25
save_strategy: steps
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
seed: 3407
ddp_timeout: 180000000
