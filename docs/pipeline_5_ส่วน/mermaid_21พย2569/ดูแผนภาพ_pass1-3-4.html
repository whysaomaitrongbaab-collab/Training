<script>
const DOCS = [{"name": "pass1_จำแนกหน้า.md", "md": "# Pass 1 — จำแนกหน้า / รหัสแผ่น / ชื่อแผ่น (+ ทิศหน้า Pass 0 + สารบัญ↔t07)\n\nสถานะ 21 พ.ย. 2569 · โค้ด: `tools/page_orient.py` (Pass 0) · `tools/pass1_sheet_classify.py` · `tools/titleblock_extract.py` · `tools/pass1_toc.py` (ตรรกะสารบัญ)\nสี: 🟩 ทำแล้วและวัดแล้ว · 🟨 ทำบางส่วน/ตรรกะเท่านั้น · 🟥 ยังไม่ได้ทำ · 🟦 ข้อเสนอ (ยังไม่ได้ลงมือ)\n\n## แผนภาพที่ 1 ภาพรวม\n\n```mermaid\nflowchart TD\n  IN[\"drawing.pdf ทั้งเล่ม\"] --> PI[\"ต่อหน้า: page_info<br/>ชนิดหน้า vector / raster / mixed / empty\"]\n  PI --> P0[\"Pass 0 page_orient.decide<br/>ทิศหน้า = turns 0-3<br/>(หมุนตามเข็มกี่ครั้งให้ตั้งตรง)<br/>แผนภาพที่ 2\"]\n  P0 --> PROBE[\"ขั้น 1 โพรบโซนกรอบชื่อแบบ<br/>(lightweight crop + เช็คคำ)<br/>แผนภาพที่ 3\"]\n  PROBE --> ZL[\"Title Block Zone log<br/>zone, confidence, ready,<br/>samples, rect, seconds\"]\n  ZL --> RUN[\"ขั้น 2 รันทั้งเล่ม ต่อหน้า<br/>อ่านรหัสแผ่น + ชื่อแผ่น<br/>แผนภาพที่ 4\"]\n  RUN --> FLAG[\"ติดธง<br/>titleblock_not_found<br/>titleblock_moved<br/>titleblock_outside_zone\"]\n  FLAG --> OUT[\"ขั้น 3 pass1_sheet_classified.json<br/>pdf_page, kind, logic, sheet_code, sheet_name,<br/>source, strip, code_pos, in_zone, flag,<br/>turns, orient_how\"]\n  OUT --> NEXT[\"ส่งต่อ Pass 2 (รหัสแผ่นผูกกับเลขหน้า PDF)\"]\n  OUT -.-> TOC[\"ส่วนเสริม: สารบัญ + t07 จำแนกประเภทหน้า<br/>แผนภาพที่ 5 (ตรรกะเท่านั้น)\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  class IN,PI,P0,PROBE,ZL,RUN,FLAG,OUT,NEXT ok\n  class TOC part\n```\n\n## แผนภาพที่ 2 Pass 0: ทิศหน้ากระดาษ (`page_orient.py`)\n\n```mermaid\nflowchart TD\n  A[\"หน้าหนึ่งหน้า\"] --> B[\"มีข้อความฝังใน PDF<br/>≥ 30 คำ?\"]\n  B -->|\"ใช่\"| C[\"text_turns: ดูทิศของข้อความฝัง<br/>ต้องไปทางเดียวกัน ≥ 70%\"]\n  C --> C1[\"turns 0 / 1 / 2 / 3\"]\n  B -->|\"ไม่\"| D[\"ตามองเห็นเป็นแนวตั้ง?<br/>(กว้าง < สูง)\"]\n  D -->|\"ใช่ = แบบแนวนอนที่สแกนมาตะแคง<br/>(26 จาก 26 หน้าในคลัง)\"| E[\"OCR 3 รอบ ลำดับ: หมุน 0, หมุน 2, แล้วหมุน 1<br/>นับเฉพาะพยัญชนะไทย<br/>(ตัวเลข/ละตินเป็นสัญญาณรบกวน)\"]\n  E --> F[\"ตัดสินจากคู่ทิศติดกัน (u, u+1)<br/>ที่แรงสุด · ตัวอักษร < 40 → เรนเดอร์ 2 เท่าแล้วลองใหม่\"]\n  F -->|\"ตัดสินได้\"| C1\n  F -->|\"ไม่แน่ใจ\"| G[\"turns = None → ใช้ 0 (ไม่หมุน)\"]\n  D -->|\"ไม่ = แนวนอน\"| H[\"not_checked → turns 0<br/>ไม่มีวิธีตรวจทิศที่วัดแล้วใช้ได้\"]\n  C1 --> Z[\"ผล: หมุนหน้าให้ตั้งตรงก่อนตัดโซน/OCR<br/>(ใช้ทั้งโพรบ อ่านรหัส อ่านชื่อ)\"]\n  G --> Z\n  H --> Z\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class A,B,C,C1,D,E,F,Z ok\n  class G part\n  class H no\n```\n\nผลที่วัด: หน้าเวกเตอร์ที่ข้อความตะแคง 953 หน้าใน 35 เล่ม ทุกหน้าต้องหมุน 3 ครั้ง (ไม่มีทิศอื่นปน) · หน้าสแกนตะแคง 26 หน้า ตัดสินได้ 25 (ตรวจด้วยตา 3, ที่เหลือตรวจแค่ความสม่ำเสมอ) · ตัวจำแนกทิศสำเร็จรูป (PP-LCNet) ผิดราว 94% บนหน้าแนวนอน ใช้ไม่ได้ · **ไม่ได้ตรวจ:** หน้าสแกนแนวนอนที่เนื้อหาตะแคงข้างใน\n\n## แผนภาพที่ 3 ขั้น 1: โพรบโซน (lightweight title block crop)\n\n```mermaid\nflowchart TD\n  S[\"เลือกหน้าตัวอย่าง<br/>ไม่นับหน้าว่าง · ครึ่งกลางของเล่ม (25%-75%)<br/>เว้นระยะเท่าๆ กัน สูงสุด 6 หน้า\"] --> L[\"ต่อหน้าตัวอย่าง ต่อโซน (หมุนตาม turns ก่อน)\"]\n  L --> RZ[\"โซนขวา x ≥ 0.80, y ≥ 0.50<br/>(หน้า letter ตัวอย่าง: ภาพ 660x1275 px)\"]\n  L --> BZ[\"โซนล่าง x ≥ 0.50, y ≥ 0.85<br/>(หน้า letter ตัวอย่าง: ภาพ 1650x383 px)\"]\n  RZ --> O[\"OCR ภาษาไทยของครอป<br/>+ คำฝังในโซนเดียวกัน (หน้าที่หมุนไม่ใช้คำฝัง)\"]\n  BZ --> O\n  O --> K[\"นับคำ 5 กลุ่ม<br/>code · title · scale · date · project<br/>(กลุ่มที่เลือกเอง ไม่ใช่มาตรฐาน)\"]\n  K --> C[\"coverage ของหน้า = กลุ่มที่เจอ / 5\"]\n  C --> E[\"มี 2 หน้าถึง 0.8 แล้ว?\"]\n  E -->|\"ไม่ และยังไม่ครบ 6 หน้า\"| S\n  E -->|\"ใช่ หรือครบ 6 หน้า\"| Z[\"คะแนนโซน = coverage สูงสุดอันดับ 2<br/>(ต้องมี 2 หน้าเห็นพ้อง)<br/>เสมอ = โซนที่ OCR อ่านบรรทัดมากกว่า\"]\n  Z --> R[\"คะแนน ≥ 0.80 (READY ของ King)?\"]\n  R -->|\"ใช่\"| LOCK[\"ล็อกโซน → zone log ready = true\"]\n  R -->|\"ไม่\"| UN[\"ไม่ล็อก → ใช้ลำดับค้นเดิม<br/>(ผลยังออก ไม่หยุด)\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  class S,L,RZ,BZ,O,K,C,E,Z,R,LOCK ok\n  class UN part\n```\n\nผลที่วัด (บางส่วน · กฎสุ่มหน้ารอบแรก): 15 เล่มบ้านเล็ก 1 ชั้น (เลือกทุกเล่มที่ 5): หน้าที่เฉลยมีรหัส 205 หน้า ถูก 183 · ไม่เจอ 22 (อยู่ใน `1ชั้น_06` ทั้งหมด) · **ผิด 0** · ล็อกโซน 13 เล่ม ไม่ล็อก 2 เล่ม · `174` โซนล่าง คะแนน 1.0 รหัส S-07..S-11 5/5 · โพรบ 33.2 วินาที รันทั้ง 5 หน้า 138.6 วินาที\n**ข้อจำกัด:** โพรบมองไม่เห็นเล่มที่หน้ากลางเล่มส่วนใหญ่เป็น BOQ (`1ชั้น_06` ได้ 0.2 ไม่ล็อก) · ยังไม่ได้เทียบความเร็วกับตัวอ่านเดิม · \"lightweight\" ของ King อาจหมายอย่างอื่น (เช่น หาตำแหน่งกรอบจากความหนาเส้น) ยังไม่ได้ถาม · ทดลองความหนาเส้นกับ `1ชั้น_27` 6 หน้า ชี้กรอบไม่ได้ (กรอบพล็อตที่ความหนาเดียวกับเส้นทั่วไป)\n\n## แผนภาพที่ 4 ขั้น 2: อ่านรหัสแผ่นและชื่อแผ่นต่อหน้า\n\n```mermaid\nflowchart TD\n  P[\"หน้าหนึ่งหน้า + turns จาก Pass 0\"] --> T[\"vector logic: ข้อความฝัง<br/>คำที่เป็นรหัสแผ่นในแถบขวา/ล่าง<br/>เลือกตัวชิดมุมขวาล่างสุด\"]\n  T --> Q[\"เจอรหัส?\"]\n  Q -->|\"ใช่\"| CODE[\"sheet_code, source = text\"]\n  Q -->|\"ไม่\"| OCR[\"png logic: OCR ตามลำดับ<br/>1 มุมขวาล่าง corner (x ≥ 0.80, y ≥ 0.86)<br/>2 โซนที่ล็อก<br/>3 โซนอื่น<br/>(ไม่ล็อก = corner → ขวา → ล่าง)\"]\n  OCR --> Q2[\"เจอรหัส?\"]\n  Q2 -->|\"ใช่\"| CODE2[\"sheet_code, source = ocr\"]\n  Q2 -->|\"ไม่\"| NF[\"ไม่มีรหัส → ติดธง titleblock_not_found\"]\n  CODE --> NAME\n  CODE2 --> NAME\n  NAME[\"อ่านชื่อแผ่น: ข้อความฝังก่อน แล้ว OCR ไทย<br/>โซนชื่อ ขวา x ≥ 0.72, y ≥ 0.40 / ล่าง x ≥ 0.50, y ≥ 0.80<br/>หยุดที่คำจบ เช่น มาตราส่วน วันที่ เลขที่ (ไม่เก็บข้อความดิบ มีชื่อวิศวกร)\"]\n  NAME --> M[\"flag_moved ทั้งเล่ม<br/>ตำแหน่งกลางจากรหัสที่ปรากฏหน้าเดียว<br/>เกิน 0.06 ของหน้า = titleblock_moved\"]\n  NF --> M\n  M --> Z[\"in_zone: รหัสอยู่นอกโซนที่ล็อก = titleblock_outside_zone\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class P,T,Q,CODE,OCR,Q2,CODE2,NAME,Z ok\n  class M part\n  class NF no\n```\n\nผลที่วัด: `titleblock_extract.py` รหัสแผ่นถูก 475/475 บนหน้าที่เฉลยเป็นรหัสแบบตัวอักษร+เลข (ตัวอย่าง 33 เล่ม) · หน้าสแกนตะแคง `เป็นสุข2` หน้า 5: ก่อนหมุนอ่านได้ A-05 (ผิด จากสัญลักษณ์ในวงกลม) หลังหมุน A-04 + ชื่อ \"แปลนพื้น, แปลนหลังคา\" (ถูก, วัดหน้าเดียว)\n**ที่ยังไม่พิสูจน์:** `titleblock_moved` ยังไม่เคยเห็นกรอบที่ย้ายจริง (ไม่มีในคลัง 175 เล่ม) · หน้าเวกเตอร์ที่ตะแคงยังอ่านรหัสฝังตามพิกัดที่ตามองเห็น (อาจไม่เจอ ไม่ใช่อ่านผิด) · ชื่อแผ่นเป็นหน้าที่กรอบไม่มีป้ายชื่อจะว่าง\n\n## แผนภาพที่ 5 ส่วนเสริม: สารบัญ → t07 จำแนกประเภทหน้า → เทียบกัน (`pass1_toc.py`)\n\n```mermaid\nflowchart TD\n  IDX[\"หาหน้าสารบัญ<br/>(ยังไม่ได้ทำ)\"] --> OCRT[\"OCR หน้าสารบัญเป็นข้อความ<br/>แยกแถว (ชื่อ, ช่วงรหัส)<br/>(ยังไม่ได้ทำ — ต้องทดสอบกับหน้าจริง)\"]\n  OCRT --> TAIL[\"sheet_list_tail<br/>หาง SHEET LIST ตามฟอร์แมตที่ t07 ถูกสอน<br/>คีย์ title, sheet_range เท่านั้น · ไม่มีรายการ = ไม่มีหาง<br/>ใช้สารบัญหน้าที่เลขน้อยสุดเท่านั้น (ตามชุดเทรน)\"]\n  TAIL --> T07[\"t07 pass0 อ่านภาพหน้า + หาง<br/>ตอบ subtask ต่อหน้า<br/>(t07 ยังไม่ได้เทรน · worker ยังไม่ส่งหาง)\"]\n  OCRT --> ET[\"entry_types: ชื่อไทย → subtask<br/>(ตารางเดียวกับ prompt ของ t07)<br/>ชื่อเดียวกันต่างระบบ: A = สถาปัตย์, S = โครงสร้าง<br/>ชื่อหยาบ = ชุด subtask ทั้งระบบ\"]\n  ET --> JN[\"toc_types_by_page<br/>ผูกแถวสารบัญกับหน้า PDF ด้วยรหัสแผ่น<br/>(รหัสจาก Pass 1 ทั้งแบบ A01 และ A-01)<br/>หลายแถวรหัสเดียว = แถวที่เจาะจงสุด\"]\n  JN --> RC[\"reconcile ต่อหน้า\"]\n  T07 --> RC\n  RC -->|\"ทั้งคู่มี มีตัวร่วม\"| AG[\"agree → ใช้ตัวร่วม\"]\n  RC -->|\"ทั้งคู่มี ไม่มีตัวร่วม\"| MM[\"mismatch → UNION ของทั้งสอง + เตือน<br/>toc_vs_t07_mismatch\"]\n  RC -->|\"t07 ไม่มี (ล้ม/ยังไม่รัน)\"| TO[\"toc_only → ใช้สารบัญ + เตือน t07_unavailable<br/>(fail-safe)\"]\n  RC -->|\"สารบัญไม่มีแถวของหน้า\"| T7[\"t07_only → ใช้ t07 + หมายเหตุ toc_has_no_row\"]\n  RC -->|\"ไม่มีทั้งสอง\"| NO[\"none → ผู้เรียกใช้ทางเดิม ห้ามเดาประเภท\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class TAIL,ET,JN,RC,AG,MM,TO,T7,NO part\n  class IDX,OCRT,T07 no\n```\n\nสถานะ: เฉพาะกล่องสีเหลือง (ตรรกะ) มีโค้ดและ self-check (`pass1_toc.py --demo`, ทำกฎเสีย 9 ข้อจับได้ครบ) · ทดสอบกับสารบัญจริงของ `1ชั้น_01` หน้า 3: 15 แถว จับคู่ได้ 15 หน้า ดูด้วยตาว่าสมเหตุสมผล · **ยังไม่ได้เทียบกับผลของ t07 เพราะไม่มี** · กล่องสีแดงยังไม่ได้ทำ\n**ข้อควรระวัง:** t07 ถูกสอนด้วยสารบัญหน้าเลขน้อยสุด แต่หลายเล่มมีสารบัญหลักบวกสารบัญย่อยรายระบบ (เช่น `1ชั้น_03` หน้า 2, 3, 18, 28, 35) ถ้ารวมหลายหน้าส่งให้ t07 จะต่างจากที่เทรน · OCR อ่านชื่อผิดก็เป็น train/serve mismatch ได้อีกทาง\n\n## แผนภาพที่ 6 ข้อเสนอ (ยังไม่ได้ลงมือ): ครอปแถบขวาปรับตามขอบกรอบ\n\n```mermaid\nflowchart TD\n  V[\"หน้าเวกเตอร์: ดึงเส้นทึบตั้งยาวใกล้ขอบขวา<br/>ที่ลากเกือบเต็มความสูงกรอบ\"] --> E[\"ขอบซ้ายของกรอบชื่อแบบ\"]\n  E --> CR[\"ครอปพอดีกรอบ (แทนค่าตายตัว x ≥ 0.80)\"]\n  CR --> OCR2[\"ส่งเข้า OCR เหมือนเดิม\"]\n  V -->|\"หาเส้นไม่เจอ\"| FB[\"ถอยไปใช้โซนตายตัวเดิม\"]\n  S2[\"หน้าสแกน: ต้องหาจากพิกเซล<br/>(ยังไม่ได้ลอง)\"] -.-> E\n  classDef plan fill:#dbe7ff,stroke:#2457d6,color:#14213d\n  class V,E,CR,OCR2,FB,S2 plan\n```\n\nโซนตายตัวตอนนี้ครอปแล้วครอบคลุมรหัส ชื่อ มาตราส่วน วันที่ของกรอบด้านขวาครบ (ตรวจกับหน้าจริงของ `เป็นสุข2`) ครึ่งบนของกรอบ (โลโก้ ชื่อโครงการ) ไม่ถูกครอป เพราะ JSON ของ Pass 1 ไม่ใช้\n"}, {"name": "pass3_เส้นกริด.md", "md": "# Pass 3 — เส้นกริด / สเกล / Grid Master DB / Level master / Proj. Grid DB\n\nสถานะ 21 พ.ย. 2569 · โค้ด: `tools/gridlab_probe.py` (หาเส้น) · `tools/gridlab_scale.py` (สเกลและเมตร) · `tools/pass3_grid.py` (รวมเป็น master + ระดับ) · `tools/levelarm_probe.py` (อ่านระดับ)\nสี: 🟩 ทำแล้วและวัดแล้ว · 🟨 ทำบางส่วน/ผลยังใช้ไม่ได้ · 🟥 ยังไม่ได้ทำ · 🟦 ข้อเสนอ/ตั้งใจให้ t07\n\n## แผนภาพที่ 1 ภาพรวมเทียบแผนภาพ Grid Ref Detect ของ King\n\n```mermaid\nflowchart TD\n  FP[\"Floor Plan / Leveling<br/>(หน้า PDF ของบ้าน)\"] --> SU[\"Set up Logic = router<br/>route_page / rank_level_pages\"]\n  SU --> SA[\"Find Site area<br/>(ยังไม่ได้ทำ)\"]\n  SU --> XY[\"X,Y grid annotate<br/>หาเส้นจากวงหัวกริด + สเกล<br/>แผนภาพที่ 2 และ 3\"]\n  SU --> ART[\"Find ART<br/>หาหน้าที่มีระดับ (รูปตัด/รูปด้านสถาปัตย์)<br/>แผนภาพที่ 5\"]\n  XY --> MG[\"รวมเป็น Grid Master ของทั้งบ้าน<br/>แผนภาพที่ 4\"]\n  ART --> ML[\"Match LVL.grid<br/>ผูกระดับกับชื่อ/ชั้น → level master<br/>แผนภาพที่ 5\"]\n  MG --> GM[(\"Grid Master DB<br/>grid_master.json\")]\n  ML --> LM[(\"LVL / level master<br/>level_master.json\")]\n  GM --> PG[(\"Proj. Grid DB<br/>proj_grid.json\")]\n  LM --> PG\n  SA -.-> PG\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class FP,SU,XY,MG,GM,PG ok\n  class ART,ML,LM part\n  class SA no\n```\n\nที่ใช้ได้จริงตอนนี้: เส้นกริดชนิด named บนหน้าเวกเตอร์ → Grid Master · ระดับ (Leveling) ยังใช้ไม่ได้ · Find Site area ยังไม่ได้ทำ\n\n## แผนภาพที่ 2 หาเส้นกริดจากวงหัวกริด (`gridlab_probe.detect()`)\n\n```mermaid\nflowchart TD\n  PG[\"หน้าเวกเตอร์ หนึ่งครั้ง get_drawings() ต่อหน้า\"] --> CI[\"หาวงหัวกริด<br/>วงเวกเตอร์ (circle)\"]\n  CI --> ST[\"หาก้านของวง: เส้นยาวด้านเดียว<br/>กฎจุดศูนย์กลาง divided() · กฎสัมผัส<br/>(0.2d + ไม่สมมาตร + ท่อนแรก ≤ 0.5d)\"]\n  ST --> LB[\"ชื่อของวง\"]\n  LB -->|\"มีข้อความฝังในวง\"| T1[\"ใช้ข้อความฝัง\"]\n  LB -->|\"ไม่มี (ตัวหนังสือเป็นเส้น)\"| T2[\"OCR ในวง<br/>มาสก์เส้นวง 0.45d\"]\n  T1 --> CS[\"ชื่อสอดคล้องกันทั้งแถว<br/>ค่าคลาดเคลื่อนสัมพัทธ์ · กู้แถวที่เหลื่อม (stagger rescue)<br/>_merge: กฎขนาด + ชื่อที่มีหลักฐานมากสุด<br/>แถวไม่มีชื่อ = ทิ้ง · คะแนนชื่อเสมอ = ไม่ทิ้งอะไร\"]\n  T2 --> CS\n  CS --> PL[\"จับคู่เป็นแปลน (plan id)<br/>จับจากแถวที่มีชื่อเท่านั้น\"]\n  PL --> DF[\"เส้นประ (dash) สำรอง<br/>เก็บเฉพาะเส้นที่มีชื่อ<br/>(ตัดเส้นปลอมออก 140 เส้น)\"]\n  DF --> OUT[\"เส้นต่อแกนต่อแปลน<br/>ชื่อ · pos (pt) · plan id · แหล่งที่มา\"]\n  PG -.->|\"หน้าสแกน ไม่มีวงเวกเตอร์\"| NO[\"ไม่เจอเส้น (OpenCV ติดตั้งแล้ว ยังไม่ได้เขียน)\"]\n  OUT -.->|\"เส้นที่ไม่มีวง (dummy)\"| DM[\"หาไม่ได้ — ตั้งใจให้ t07 อ่านจากตัวเลขระยะ<br/>(ยังไม่เทรน ยังไม่วัด)\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  classDef plan fill:#dbe7ff,stroke:#2457d6,color:#14213d\n  class PG,CI,ST,LB,T1,T2,CS,PL,DF,OUT ok\n  class NO no\n  class DM plan\n```\n\nผลวัดกับเฉลย (2 หน้าแปลนต่อบ้านที่มี grid master, 276 แกน): ชื่อเส้นตรงทั้งชุด **251 (91%)** (ก่อนเปลี่ยนวิธี 54) · ได้ไม่ครบ 7 (ส่วนใหญ่เพราะหน้านั้นวาดกริดน้อยกว่า master ของบ้าน และเฉลยบางจุดผิดเอง) · ไม่เจอเส้น 18 (16 หน้าสแกน, `2ชั้น_22` หน้า 14, `1ชั้น_03` หน้า 11 แกน x เจอ 1 จาก 3) · เส้นเกินเฉลย 0 · ตำแหน่ง: 282 จาก 283 แกนที่มี ≥ 3 เส้น คลาด ≤ 2 ซม.\nรีวิวหักล้าง: รอบ 1 agent 18 ตัว 37 หน้า แล้วแก้ · รอบ 2 หน้าใหม่ 32 หน้า ผ่าน 25 ผิด 7 แก้ 5 (ตรวจซ้ำด้วย detect() ไม่ได้ให้ agent ตัดสินใหม่) · **ยังไม่แก้ 2:** หน้ารายละเอียดที่วงจุดเหล็ก/เสาเข็มหกเหลี่ยมถูกอ่านเป็นเส้นกริด (`1ชั้น_04` หน้า 36, `2ชั้น_07` หน้า 27 · ตัวรันข้ามเพราะมีแกนเดียว) · ทำกฎเสียทีละข้อ 18 ข้อ `--demo` จับได้ครบ\n\n## แผนภาพที่ 3 สเกลและเมตร (`gridlab_scale.py`)\n\n```mermaid\nflowchart TD\n  L[\"เส้นต่อแปลน (จากแผนภาพที่ 2)\"] --> N[\"OCR ตัวเลขระยะ<br/>ระหว่างแถววงหัวกริดกับตัวอาคาร\"]\n  N --> P[\"จับคู่ตัวเลขกับช่องระหว่างเส้นติดกัน<br/>ตัวเลขต้องอยู่กลางช่อง ± 3% (MID_TOL)<br/>(ระยะย่อยที่บังเอิญอยู่ใกล้กลางช่อง = ตัดทิ้ง)\"]\n  P --> R[\"แต่ละคู่ให้ pt ต่อเมตร<br/>รวมทั้งสองแกน · ช่วงที่รับ 5 - 150 pt/m\"]\n  R --> S[\"เลือกสเกลที่คู่ส่วนใหญ่เห็นพ้อง<br/>(AGREE 1.5%)\"]\n  S -->|\"เจอ\"| M[\"pos_m ของทุกเส้นจากเส้นแรกของแปลน (origin 0)\"]\n  S -->|\"ไม่เจอ\"| X[\"ไม่ใส่เมตร\"]\n  M --> OUT[\"เส้นพร้อม pos_m\"]\n  NOTE[\"ไม่ใช้สเกลที่พิมพ์ในแบบ<br/>(1:75 ควรได้ 37.8 pt/m แต่ 1ชั้น_27 จริง 35.0)\"] -.-> S\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  class L,N,P,R,S,M,OUT ok\n  class X,NOTE part\n```\n\nผลวัด: เจอสเกล 154/155 แปลน · ช่องระหว่างเส้นติดกันคลาด ≤ 2 ซม. 841/842 · **พลาดตอนร่างแรก:** MID_TOL 8% รับระยะ 0.50 ที่ห่างกลางช่อง 8.5 pt ได้สเกลปลอม 210 pt/m (`1ชั้น_27` หน้า 11) → แก้เป็น 3% + ช่วง + เคสใน demo\n**ข้อจำกัด:** ตัวเลขระยะย่อยใช้เพื่อหาสเกลเท่านั้น ไม่ได้ใช้สร้างเส้น dummy · ต้องมีตัวเลขระยะอยู่ระหว่างวงหัวกริดกับตัวอาคาร · โซ่ระยะอีกฝั่งยังไม่ได้อ่าน · ถ้าแบบวาดวงห่างขีดบอกระยะ เส้นตามวง (เช่น `2ชั้น_07` หน้า 5 คลาด 0.18 ม.)\n\n## แผนภาพที่ 4 รวมเป็น Grid Master ของทั้งบ้าน (`pass3_grid.merge_plans / merge_axis`)\n\n```mermaid\nflowchart TD\n  PL[\"เส้นของแต่ละแปลนในทุกหน้า<br/>(หน้าที่เลือกด้วยรูปทรง ไม่ดูรายชื่อแปลนของเฉลย)\"] --> FI[\"แปลนใช้ได้ไหม\"]\n  FI -->|\"ชื่อซ้ำในแปลนเดียว หรือเส้นที่มีชื่อ+เมตร น้อยเกินจะจัดแนว\"| SK[\"ข้ามแปลน + เตือน\"]\n  FI -->|\"ใช้ได้\"| REF[\"แปลนอ้างอิง = แปลนที่มีเส้นมากสุด<br/>เท่ากัน = หน้าน้อยกว่า\"]\n  REF --> AL[\"แปลนอื่นเลื่อนให้ชื่อที่ซ้ำกับ master ตรงกัน\"]\n  AL --> SH[\"ชื่อซ้ำกี่ตัว\"]\n  SH -->|\"≥ 2 ตัว และออฟเซ็ตต่างกัน > 0.05 ม.\"| DR[\"ทิ้งทั้งแปลน (ไม่เฉลี่ย)<br/>+ เตือน\"]\n  SH -->|\"≥ 2 ตัว ออฟเซ็ตลงรอยกัน\"| ADD[\"รวมเส้นของแปลนนั้น<br/>(ตำแหน่ง = มัธยฐานของทุกแปลน, spread_m ถ้าเกิน)\"]\n  SH -->|\"1 ตัว\"| WK[\"เก็บ แต่ติด weak\"]\n  SH -->|\"0 ตัว\"| NS[\"ไม่จัดแนว ข้ามแปลน + เตือน<br/>(ไม่มีหลักฐานตำแหน่งร่วม)\"]\n  ADD --> SP[\"สองชื่อที่ตำแหน่งเดียวกัน<br/>(ห่าง < 0.02 ม.)\"]\n  WK --> SP\n  SP -->|\"เสียงต่างกัน\"| KV[\"เก็บชื่อที่เสียงมากกว่า\"]\n  SP -->|\"เสียงเท่ากัน\"| KB[\"เก็บทั้งคู่ + เตือน\"]\n  KV --> MS[\"grid_master.json<br/>x_lines · y_lines (+ z_levels จากแผนภาพที่ 5)\"]\n  KB --> MS\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class PL,FI,REF,AL,SH,ADD,SP,KV,MS ok\n  class WK,KB part\n  class SK,DR,NS no\n```\n\nผลเทียบเฉลย (10 บ้านเวกเตอร์ จาก 72 บ้านที่มี grid master เลือกทุกบ้านที่ 4): ชื่อเส้น named **72/72** ไม่ขาดไม่เกิน · ช่อง **52/52** ภายใน 2 ซม. · บ้าน 174 (17 แปลน, 37 นาทีขณะมีงานอื่นรัน): **11/11** เส้น **9/9** ช่อง\n**in-sample บางส่วน:** รอบแรกเกิน 2 เส้น (OCR อ่าน 1 เป็น 7 ใน `1ชั้น_03` กับ `2ชั้น_08`) กฎ \"ตำแหน่งเดียวกัน\" เพิ่มหลังเห็นผล · ตัวหาเส้นจูนบน 2 หน้าแรกของบ้านชุดเดียวกัน · ทำกฎเสีย 30 ข้อ (รวมส่วนระดับ) `--demo` จับได้ครบ\n**ไม่มี:** เส้น dummy (เฉลยมี ~64%) · `dimension_chains` / `unassigned_dimensions` ตามสเปก grid master\n\n## แผนภาพที่ 5 Leveling: หาหน้าระดับ → อ่านเลข → ผูกชื่อ → level master\n\n```mermaid\nflowchart TD\n  RT[\"route_page / rank_level_pages<br/>จัดอันดับหน้าที่น่าจะมีระดับ\"] --> A1[\"Find ART 1: รหัสแผ่นขึ้นต้น A / AR?\"]\n  A1 -->|\"ใช่\"| PG[\"หน้าระดับ\"]\n  A1 -->|\"ไม่ใช่/ไม่มีรหัสฝัง\"| A2[\"Find ART 2: ข้อความฝังมีเลขระดับ ≥ 3 ค่า?\"]\n  A2 -->|\"ใช่\"| PG\n  A2 -->|\"ไม่\"| A3[\"Find ART 3: สแกนหยาบ OCR ละติน 1,600 px<br/>หน้าที่เจอเลขระดับ ≥ 3 ค่า\"]\n  A3 --> PG\n  PG --> FR[\"อ่านเต็ม: OCR ละติน + ไทย 3,300 px<br/>(หมุนตาม turns)\"]\n  FR --> BN[\"bind_names: ผูกเลขระดับกับชื่อไทยข้างป้าย<br/>(ป้ายของตัวเอง > บรรทัดเดียวกัน > เหนือป้ายเล็กน้อย)\"]\n  BN --> FL[\"floor_of: ชื่อบอกชั้นไหน<br/>ชนะด้วยจำนวนเสียงต่อชั้น · เสมอ = level_m ว่าง + candidates\"]\n  FL --> CK[\"ตรวจ: level_m ต้องมีใน z_levels<br/>ลำดับชั้นต้องสูงขึ้น F1 < F2 < RF\"]\n  CK -->|\"ผ่าน\"| LM[\"level_master.json<br/>floors[] floor_level, level_m,<br/>structure_level_m, printed_as<br/>+ z_levels ทะเบียนทุกค่า\"]\n  CK -->|\"ไม่ผ่าน\"| WN[\"ปฏิเสธค่า + เตือน (ไม่แต่งระดับขึ้นเอง)\"]\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class RT,A1,A2,A3,PG,FR,BN,FL,CK,LM,WN part\n```\n\n**ผล: ใช้ไม่ได้ตอนนี้ (อย่ารายงานว่า Leveling เสร็จ)**\n- Find ART 1 จากรหัสแผ่น: ใน 129 หน้าที่เฉลยอ่านระดับ (40 เล่ม) มีรหัสข้อความฝัง 3 หน้า และไม่มีรหัสขึ้นต้น A เลย · 26 จาก 40 เล่มไม่มีรหัสฝังสักหน้า · ทางสำรองข้อความฝัง ถูก 0 จาก 6 หน้า\n- OCR เลขระดับ: ในชุดวัด 43 หน้า 76 ค่าที่เฉลยมีชื่อไทยพิมพ์ เจอตัวเลข 60 (79%) · ชื่อไทยตรง ≥ 0.8 อยู่ 48 (80% ของที่เจอ) ผิด 11 · กฎปรับบนชุด 43 หน้าชุดเดียวกัน ไม่มีชุดแยกทดสอบ\n- **บ้าน 174 (ชุดเดียวที่มี level master เฉลย, ไฟล์เฉลยสร้างโดย session ก่อน ยังไม่มีคนตรวจ): level master ได้ 0/9 ชั้น** · สแกนหยาบเจอหน้าระดับ 4 จาก 26 หน้า · อ่านค่าได้ 11 ค่า ตรงเฉลย 2 ค่า (-1.00, +1.90) · ไม่มีชื่อไทยผูก จึงกำหนดชั้นไม่ได้\n- ยังไม่ได้ลอง: สแกนที่ความละเอียดสูงขึ้น · ใช้ชื่อแผ่นจาก Pass 1 เลือกหน้ารูปตัด/รูปด้าน · กำหนดชั้นจากลำดับระดับแทนชื่อไทย\n\n## แผนภาพที่ 6 ใครหาเส้นชนิดไหน (named / dummy)\n\n```mermaid\nflowchart LR\n  AX[\"เส้นกริดของบ้านหนึ่งหลัง\"] --> NM[\"named: มีวงหัวกริด\"]\n  AX --> DU[\"dummy: มีแต่ขีดบอกระยะ ไม่มีวง<br/>(เฉลยมี ~64%)\"]\n  NM --> LG[\"หาด้วย logic (แผนภาพที่ 2 - 4)<br/>วัดแล้ว: 72/72 บน 10 บ้าน · 11/11 บนบ้าน 174<br/>เฉพาะหน้าเวกเตอร์\"]\n  DU --> T7[\"ตั้งใจให้โมเดล t07 อ่านจากตัวเลขระยะ<br/>(งานย่อย gridline ของ t07 อ่านทีละหน้า ทั้ง named และ dummy)<br/>ยังไม่เทรน ยังไม่วัด\"]\n  DU -.-> LV[\"ทางเลือกที่ยังไม่ได้ลอง: logic บนหน้าเวกเตอร์<br/>หาขีดบอกระยะสั้นๆ + OCR ตัวเลขข้างขีด\"]\n  LG --> JOIN[\"วิธีรวมสองทาง: ยังไม่ได้ออกแบบ\"]\n  T7 --> JOIN\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef plan fill:#dbe7ff,stroke:#2457d6,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class AX,NM,DU,LG ok\n  class T7,LV plan\n  class JOIN no\n```\n\nรายละเอียดการแบ่งงานนี้จดไว้ที่ `tune_ai/t07_Palfrey/pass_gridline/README.md`\n"}, {"name": "pass4_หา_element.md", "md": "# Pass 4 — SP (แปลนโครงสร้าง): ตารางกริด · pixel lock · ตรวจกับของที่วาด\n\nสถานะ 21 พ.ย. 2569 · โค้ด: `tools/pass4_sp.py` (session อื่นของมะขามสร้าง ยังไม่ commit) · **ไม่เรียกโมเดล**\nสี: 🟩 ทำแล้วและวัดแล้ว · 🟨 ทำบางส่วน · 🟥 ยังไม่ได้ทำ · 🟦 ตั้งใจให้ t07 (ยังไม่เทรน)\n\n> **ข้อควรรู้ก่อนอธิบาย Pass 4:** ตอนนี้ยังไม่มีโมเดลอ่านแปลนที่เทรนแล้ว ไฟล์นี้จึง**ไม่ได้หา element จากภาพ** มันใช้ element ในไฟล์เฉลย (`beam_plan`, `footing_plan` ฯลฯ) เป็นตัวแทนสิ่งที่โมเดลจะอ่าน **และใช้ grid master (ชื่อเส้น + เมตร) จากไฟล์เฉลยด้วย** (`load_master()` อ่าน `*gridline*.json`) ไม่ใช่ `grid_master.json` ที่ Pass 3 สร้าง Pass 3 → Pass 4 ยังไม่ได้ต่อสาย ส่วนที่เป็น logic/OCR จริงคือเส้นกริดและตำแหน่งบนหน้า (ผ่าน `gridlab_probe.detect(ocr=True)`) ตัวเลขทุกตัวจึงวัด \"ตารางกริดที่ส่งให้ + การล็อกพิกเซล + การตรวจกับของที่วาด\" ไม่ได้วัดความสามารถอ่านแบบของโมเดล\n\n## แผนภาพที่ 1 ภาพรวม: ใครทำอะไร\n\n```mermaid\nflowchart TD\n  PG[\"หน้าแปลนเวกเตอร์<br/>เส้นกริดบนหน้า (grid lab: logic + OCR ในวง)\"] --> GI[\"ขั้น 1 ตารางกริด Input Grid Line Coordinate<br/>ชื่อ · เมตร · pt · พิกเซล 200 dpi<br/>แผนภาพที่ 2\"]\n  GMS[\"grid master ของบ้าน (ชื่อเส้น + เมตร + ชนิด named/dummy)<br/>ตอนนี้อ่านจากไฟล์เฉลย gridline.json<br/>ไม่ได้ใช้ grid_master.json ที่ Pass 3 สร้าง (ยังไม่ได้ต่อสาย)\"] --> GI\n  SRC[\"ตัวหา element (ใครบอกว่ามี element อะไร อยู่ที่ grid_ref ไหน)\"]\n  SRC -->|\"ตอนนี้: ไฟล์เฉลย<br/>beam_plan / footing_plan ฯลฯ\"| EL[\"element + grid_ref\"]\n  SRC -.->|\"ตั้งใจ: t07 งานย่อย plan_beam / plan_footing / plan_slab<br/>(ยังไม่เทรน ยังไม่วัด)\"| EL\n  GI --> LK[\"ขั้น 2 pixel lock<br/>grid_ref → ตำแหน่งบนภาพ<br/>แผนภาพที่ 3\"]\n  EL --> LK\n  LK --> VF[\"ขั้น 3 ตรวจว่าตำแหน่งนั้นมีของวาดอยู่จริง<br/>(เฉพาะหน้าเวกเตอร์ · กฎเรขาคณิต)<br/>แผนภาพที่ 4\"]\n  VF --> CT[\"เทียบกับตัวควบคุม<br/>จุดตัดกริดที่ไม่มี element · ช่วงกริดที่ไม่มีคาน\"]\n  CT --> OUT[\"pass4_sp_pNN.json + overlay png\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef plan fill:#dbe7ff,stroke:#2457d6,color:#14213d\n  class PG,GI,LK,VF,CT,OUT ok\n  class EL,GMS part\n  class SRC plan\n```\n\n**Pass 4 ตอนนี้ไม่ได้หา element:** ตำแหน่งที่จะไปดูมาจาก element ในเฉลยที่รู้ชื่อและ grid_ref อยู่แล้ว สิ่งที่พิสูจน์แล้วคือ \"ล็อกตำแหน่งแล้วมีของวาดอยู่จริง\" ไม่ใช่ \"หา element ได้\"\n\n## แผนภาพที่ 2 ขั้น 1: ตารางกริดสำหรับ \"Analyze SP\"\n\n```mermaid\nflowchart TD\n  D[\"gridlab_probe.detect() ต่อหน้า<br/>เส้นบนหน้า (ชื่อ + ตำแหน่ง pt) ต่อแปลน\"] --> MT[\"จับคู่ชื่อกับ grid master ของบ้านที่ให้เมตร<br/>(master จากไฟล์เฉลย ไม่ใช่ผลของ Pass 3)\"]\n  MT --> FT[\"ต่อแปลนต่อแกน ฟิตเส้นตรงเดียว<br/>pt = a × เมตร + b (fit_axis)\"]\n  FT --> CK[\"มีเส้นใดห่างเส้นฟิต เกิน 3 pt?<br/>(FIT_TOL_PT ≈ 8 ซม. ที่ 1:75 · ค่าที่เลือกเอง)\"]\n  CK -->|\"ใช่ = ชื่อผิด\"| RJ[\"ทิ้งแปลนนั้น (ไม่มีตาราง)\"]\n  CK -->|\"ไม่\"| TB[\"ตาราง: ทุกเส้นใน master มี<br/>ชื่อ · เมตร · pt · พิกเซลที่ 200 dpi (เดียวกับภาพเทรน)\"]\n  D -.->|\"หน้าสแกน: หาเส้นกริดไม่ได้เลย\"| SC[\"ไม่มีตาราง → ล็อกไม่ได้<br/>(25 จาก 27 หน้าที่ล็อกไม่ได้)\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class D,MT,FT,CK,TB ok\n  class RJ,SC no\n```\n\n## แผนภาพที่ 3 ขั้น 2: pixel lock (grid_ref → ตำแหน่งบนภาพ)\n\n```mermaid\nflowchart TD\n  E[\"element หนึ่งตัว + grid_ref\"] --> SR[\"split_ref: แยกเป็น<br/>(เส้นตั้ง x, เส้นนอน y) ตาม id ใน master<br/>รองรับ A1 · 1-A · A'1\"]\n  SR -->|\"ได้แบบเดียว\"| KD[\"ชนิด\"]\n  SR -->|\"กำกวม หรือไม่รู้จัก<br/>(~A2, beyond A x 1-2, ข้อความอิสระ)\"| NL[\"ไม่ล็อก ไม่เดา (กฎเดียวกับ D2 ของ grid ref)\"]\n  KD -->|\"เสา / ฐานราก\"| PT[\"จุด = จุดตัดของสองเส้น\"]\n  KD -->|\"คาน\"| SG[\"ท่อน = เส้นจากจุดอ้างอิงต้นถึงจุดอ้างอิงปลาย\"]\n  KD -->|\"แผงพื้น A-B x 1-2\"| RG[\"กรอบสี่เหลี่ยม (split_region)\"]\n  PT --> MP[\"หน้าเดียวมีหลายแปลน?\"]\n  SG --> MP\n  RG --> MP\n  MP -->|\"ใช่\"| BP[\"แต่ละไฟล์ view ถูกกำหนดให้แปลนที่ล็อกแล้ว<br/>ลงบนของที่วาดมากสุด · คะแนนต่ำ = weak\"]\n  MP -->|\"ไม่\"| OK1[\"ล็อกบนแปลนเดียว\"]\n  BP --> LKD[\"รายการล็อก<br/>(จุดตัดแตกเป็นหนึ่งรายการต่อจุด)\"]\n  OK1 --> LKD\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  classDef part fill:#fff0b3,stroke:#b58900,color:#14213d\n  classDef no fill:#f9d0d6,stroke:#d1405a,color:#14213d\n  class E,SR,KD,PT,SG,RG,MP,OK1,LKD ok\n  class BP part\n  class NL no\n```\n\nผล: ล็อกได้ 26 หน้า · 32 ไฟล์ element · 466 element → 845 รายการล็อก · แผงพื้น 126 กรอบ · ref ที่ไม่ล็อก 64 · ไฟล์ weak 5 (`etc_plan` 4: ref เป็นข้อความอิสระ · `roof_frame_plan` 1: เกณฑ์คานไม่เหมาะกับโครงเหล็ก)\n**ตัวอย่างที่ล็อกพลาด:** `1ชั้น_25` หน้า 24 สองแปลน (ซ้าย ฐานราก, ขวา คาน) แต่ overlay ของคานและแผงพื้นไปอยู่บนแปลนซ้าย ยังไม่ได้ตรวจว่าทำไมเลือกแปลนซ้าย\n\n## แผนภาพที่ 4 ขั้น 3: ตรวจกับของที่วาดจริง (หน้าเวกเตอร์) เทียบตัวควบคุม\n\n```mermaid\nflowchart TD\n  PD[\"drawn_things: get_drawings() ของหน้า<br/>พิกัดคูณ rotation_matrix ให้เป็นพิกัดที่ตามองเห็น<br/>(หน้า /Rotate ราวครึ่งคลัง · ก่อนแก้คะแนนเป็น 0 ทั้งที่ล็อกถูก)\"] --> PC[\"ท่อนเส้นทึบยาว ≥ 3 pt<br/>(เส้นประของกริดไม่นับ)\"]\n  PD --> BX[\"กรอบ = กรอบล้อมของทุก path ที่วาด<br/>+ สี่เหลี่ยม (re) นับทั้งเป็นกล่องและเป็นเส้นขอบ 4 ด้าน\"]\n  LKD[\"รายการล็อก\"] --> TY[\"ชนิด\"]\n  TY -->|\"จุด เสา/ฐานราก\"| PH[\"point_hit: มีกรอบครอบจุด (ขยาย 2 pt)<br/>ด้านสั้น ≥ 2.5 pt และด้านยาว ≤ 2.5 ม.\"]\n  PH -->|\"ไม่เจอ และเป็นแปลนฐานราก\"| BA[\"box_around: เส้นทึบแยกท่อนล้อมจุดครบสี่ด้าน<br/>(CAD บางไฟล์วาดฐานรากเป็นเส้นทีละด้าน)\"]\n  TY -->|\"คาน\"| CF[\"cover_fraction: มีเส้นทึบขนานแกน (มุมต่าง ≤ 3°)<br/>ห่างแกน 1 pt ถึง 0.4 ม. ครอบคลุม ≥ 60%<br/>ของจุดตัวอย่าง 9 จุดตามคาน\"]\n  PC --> CF\n  BX --> PH\n  PC --> BA\n  PH --> V[\"verified = จริง/เท็จ ต่อรายการ\"]\n  BA --> V\n  CF --> V\n  V --> CT[\"ตัวควบคุม (ไม่เกิน 60 ต่อแปลน)<br/>จุดตัดกริดที่ไม่มี element · ช่วงกริดที่ไม่มีคาน<br/>ใช้เกณฑ์เดียวกัน\"]\n  CT --> RS[\"อัตรา element เทียบอัตราตัวควบคุม<br/>สูงกว่าชัด จึงเชื่อว่าล็อกถูกที่\"]\n  classDef ok fill:#cfeede,stroke:#12906a,color:#14213d\n  class PD,PC,BX,LKD,TY,PH,BA,CF,V,CT,RS ok\n```\n\nสีใน overlay: ม่วงแดง = จุดเสา/ฐานราก (ติดชื่อ element) · เขียว = คานที่ล็อกแล้วเจอของที่วาดจริง · ส้ม = คานที่ล็อกแล้วแต่ไม่เจอ · น้ำเงิน = แผงพื้น\n\n## ผลวัด (`pass4_sp.py --eval` ทุกเล่มที่ 6 ที่มี grid master, 2 หน้าแปลนต่อเล่ม, 53 หน้า)\n\n| อะไร | ผล |\n|---|---|\n| ฐานราก / เสา (จุด) | **99.5%** อยู่บนของที่วาดจริง (n = 418) เทียบตัวควบคุม **16.8%** (n = 2,545) |\n| คาน | **92.7%** (n = 301) เทียบตัวควบคุม **16.5%** (n = 2,191) |\n| หน้าที่ล็อกไม่ได้ | 27 หน้า: 25 เป็นหน้าสแกน (หาเส้นกริดไม่ได้เลย) · 2 เป็นหน้ารายละเอียดเวกเตอร์ |\n| ตัวเช็คในตัว | ทำกฎเสีย 20 ข้อ จับได้ครบ 20 (รอบแรกรอด 4+1 ได้เพิ่มเทสต์) |\n\n## ที่ผลวัดเหล่านี้ไม่ได้บอก\n\n- **\"เจอของที่วาด\" ไม่ได้แปลว่าเป็น mark ที่ถูก:** สลับ mark สองตัวที่ตำแหน่งถูกต้อง ตัวตรวจนี้จับไม่ได้\n- **ตัวควบคุม ~17% ไม่ใช่ศูนย์** เพราะคานกับเสาอยู่บนหลายจุดตัดกริด และกรอบนับจากเส้นทุกเส้น ต้องอ่านตัวเลขคู่กับตัวควบคุมเสมอ\n- **ไม่ใช่การหา element:** ถ้ากวาดทุกจุดตัดกริดหาเสาด้วยรูปทรงล้วนๆ จะได้เสาปลอมราว 1 ใน 6 ของจุดตัดว่าง และรูปทรงบอกไม่ได้ว่าเป็น C1 หรือ C2\n- ตัวเลขทั้งหมดเป็นของหน้าเวกเตอร์ · หน้าสแกนยังไม่ได้ทำ\n\n## ยังไม่ได้ทำ\n\n- อ่าน element ด้วยโมเดลโดยให้ตารางกริดเป็นอินพุต (ต้อง t07 ที่เทรนแล้วบนการ์ด)\n- หน้าสแกน 25 หน้า (ติดที่ Pass 3 ยังหาเส้นกริดบนภาพไม่ได้) · ref ประมาณ `~A2` · ห้อง (`etc_plan`) · สมาชิกโครงหลังคา · ตรวจแผงพื้น · ขนาดพิกเซลของ element (มีแค่จุดกลาง/เส้น ไม่มีความกว้าง) · ต่อเข้า overlay ของ Constistant (งานของอิมบน `feat/im-overlay-promax`)\n- ค้างให้มะขามตัดสิน: ref ประมาณ `~A2` ควรล็อกที่จุดตัดใกล้สุดพร้อมธง หรือคงไม่ล็อก\n"}];
mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'loose',
  flowchart: { htmlLabels: true, curve: 'linear', useMaxWidth: true, nodeSpacing: 18, rankSpacing: 26, padding: 6 },
  themeVariables: { fontFamily: 'Sarabun, Tahoma, sans-serif', fontSize: '14px', primaryColor: '#eef3fc', primaryBorderColor: '#2457d6', primaryTextColor: '#14213d', lineColor: '#475a80' } });
(async () => {
  const root = document.getElementById('root'); let ok = 0; const fail = []; let n = 0;
  for (const [i, d] of DOCS.entries()) {
    const sec = document.createElement('section'); sec.id = 'd' + i;
    const blocks = [];
    const md = d.md.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => { blocks.push(code); return '<div class="mm" data-b="' + (blocks.length - 1) + '"></div>'; });
    sec.innerHTML = marked.parse(md); root.appendChild(sec);
    for (const el of sec.querySelectorAll('.mm')) {
      const code = blocks[+el.dataset.b]; n++;
      try { const r = await mermaid.render('m' + n, code); el.innerHTML = r.svg; ok++; }
      catch (e) { fail.push(d.name + ' #' + el.dataset.b + ': ' + String(e.message || e).slice(0, 300)); el.innerHTML = '<div class="err">mermaid error: ' + String(e.message || e).slice(0, 400).replace(/</g, '&lt;') + '</div>'; }
    }
  }
  document.getElementById('status').textContent = 'MERMAID_OK=' + ok + ' FAIL=' + fail.length + ' TOTAL=' + n + (fail.length ? ' :: ' + fail.join(' | ') : '');
})();
